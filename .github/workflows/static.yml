name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Safety gate · JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -maxdepth 1 -type f -name '*.js' -print0)

      - name: Safety gate · JSON validity
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); for (const f of ['manifest.webmanifest','meta-campaigns.json']) { JSON.parse(fs.readFileSync(f,'utf8')); console.log('Valid',f); }"

      - name: Safety gate · required app files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            index.html
            app.js
            manager-safe-loader.js
            manager-core.js
            manager-loader.js
            manager-office.js
            manager-jobs.js
            manager-leads.js
            manager-marketing.js
            manager-meta-sync.js
            manager-assets.js
            service-worker.js
            manifest.webmanifest
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Safety gate · unresolved merge markers
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --include='*.js' --include='*.html' --include='*.css' --include='*.json' .; then
            echo 'Unresolved merge marker found.'
            exit 1
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
